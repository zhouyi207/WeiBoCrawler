[package]
name = "zhihu-obscura-qr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.11"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
serde_json = "1"
tungstenite = "0.30"
